name: CI & Déploiement

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Linter TypeScript & ESLint
        run: npm run lint

      - name: Vérifier la limite de 200 lignes
        run: npm run check:lines

      - name: Tests unitaires Vitest
        run: npm test

      - name: Compilation Vite
        run: npm run build

      - name: Génération de la documentation TypeDoc
        run: npm run docs

      - name: Intégrer TypeDoc dans la distribution
        run: |
          mkdir -p dist/api
          cp -r docs/api/* dist/api/

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
